name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build desktop app and run tests
        run: ./gradlew --no-daemon build

      - name: Build Fabric mod
        run: ./gradlew --no-daemon -p fabric build

      - name: Prepare release assets
        run: |
          cp build/libs/ominous-vault-predictor-*.jar OminousVaultPredictor-desktop.jar
          cp fabric/build/libs/ominous-vault-predictor-fabric-*.jar OminousVaultPredictor-fabric-1.21.11.jar

      - name: Create GitHub release and upload JARs
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            OminousVaultPredictor-desktop.jar
            OminousVaultPredictor-fabric-1.21.11.jar
          fail_on_unmatched_files: true

